<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePath</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/outro.css">
</head>
<body>
    <div class="barraLateral">
        <section class="logoSection">
            <div class="logoWrapper">
                <img class="icon" src="img/codepath_verde.svg" alt="">
                <span></span>
                <h1 class="titulo inter">CodePath</h1>
            </div>
        </section>
        <section class="botoesSection">
            <div class="botaoLateralAtivo">
                <img src="img/home.svg" alt="graph" color="#009966">
                <span class="inter">Aprender</span>
            </div>
            <div class="botaoLateral">
                <img src="img/user.svg" alt="graph" color="#009966">
                <span class="inter">Perfil</span>
            </div>
            <div class="botaoLateral">
                <img src="img/shield.svg" alt="graph" color="#009966">
                <span class="inter">Gerência</span>
            </div>

        </section>
        <section class="userView">
            <div class="userWrapper">
                <img class="userImage" src="img/user.jpg" alt="">
                <span class="inter">Allan Lucas</span>
            </div>
            <div class="botaoExit">
                <span class="inter">Sair</span>
            </div>
        </section>
    </div>
    <div class="mainContent">
        <div class="top">
            <div class="course">
                <div class="quadradoCourse"></div>
                <div class="texto">
                    <div class="idiomaAtivo"></div>
                    <div class="nameCourse"></div>
                </div>
            </div>
            <div class="parameters">
                <div class="streak"></div>
                <div class="hearts"></div>
                <div class="xp"></div>
            </div>
        </div>
        <!--
        <div class="greeter inter text-white">
            <p class="text-xl">Bem-vindo de volta!</p>
            <p class="text-gray">Você está no nível 1. Continue assim!</p>
            <button class="startLesson">COMEÇAR LIÇÃO DE TYPESCRIPT</button>
        </div>-->
    </div>
</body>
</html>
